name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm rebuild sharp @node-rs/argon2 esbuild @prisma/engines prisma
      - run: npm run build:shared
      - run: npm run db:generate -w @fabnix/backend
      - run: npm run typecheck
      - run: npm run test:shared -- --coverage
      - run: npm run test -w @fabnix/backend
      - run: npm run build -w @fabnix/backend
